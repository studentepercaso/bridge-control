name: Bug report
description: Report a reproducible Bridge Control problem using synthetic data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include real note contents, vault names, personal paths, settings files, tokens, backups, or audit records.
        Report security issues privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Bridge Control version
      placeholder: 0.4.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Obsidian version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a disposable vault and synthetic folder names.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed personal information and real vault content.
          required: true
        - label: This is not a security vulnerability.
          required: true
